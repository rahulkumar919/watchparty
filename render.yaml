## WatchParty Backend — Render deployment manifest
## Single service: Express + Socket.IO backend only

services:
  # ─────────────────────────────────────────────────────────────────────────
  # BACKEND — Express + Socket.IO
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: watchparty-server
    runtime: node
    region: oregon          # change to singapore/frankfurt if needed
    plan: free              # upgrade to starter ($7/mo) for always-on

    buildCommand: npm ci && npm run db:generate --workspace=apps/server && npm run build && npm run db:migrate:deploy --workspace=apps/server
    startCommand: npm run start --workspace=apps/server

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # ── Database URLs — Render will provide these ────────────────────────
      - key: DATABASE_URL
        sync: false          # Will link to PostgreSQL database
      - key: DIRECT_URL
        sync: false          # Will link to PostgreSQL database
      # ── JWT Secret — Generate a secure random string ─────────────────────
      - key: JWT_SECRET
        sync: false          # Generate: openssl rand -base64 32
      - key: JWT_EXPIRES_IN
        value: 24h
      # ── CORS — Set to your frontend URL or * for testing ─────────────────
      - key: CORS_ORIGIN
        value: "*"           # Change to your frontend URL in production
